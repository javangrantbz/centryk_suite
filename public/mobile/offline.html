<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Centryk Offline</title>
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.25), transparent 35%),
        linear-gradient(180deg, #020617 0%, #0f172a 52%, #111827 100%);
      color: #fff;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(100%, 360px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 28px 24px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #bfdbfe;
    }
    h1 {
      margin: 12px 0 10px;
      font-size: 30px;
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.55;
      font-size: 14px;
      font-weight: 600;
    }
    button {
      margin-top: 18px;
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 14px 18px;
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Offline</div>
    <h1>You are not connected.</h1>
    <p>Centryk Mobile can show a cached shell offline, but live approvals, notifications, and synced company data need a connection.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
