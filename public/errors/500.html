<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Something went wrong — Centryk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #0d1117 0%, #0f1928 45%, #111d35 100%);
    -webkit-font-smoothing: antialiased;
  }
  .accent {
    position: fixed;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, #9333ea, #3b82f6, #f97316);
  }
  .glow {
    position: fixed;
    border-radius: 9999px;
    filter: blur(120px);
    pointer-events: none;
  }
  .glow-a { top: 4rem;  left: 2rem;  width: 18rem; height: 18rem; background: rgba(29, 78, 216, 0.12); }
  .glow-b { bottom: 5rem; right: 2.5rem; width: 20rem; height: 20rem; background: rgba(71, 85, 105, 0.16); }
  .wrap { position: relative; width: 100%; max-width: 28rem; text-align: center; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }
  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 3rem;
    width: 3rem;
    border-radius: 0.75rem;
    background: rgba(255, 255, 255, 0.1);
  }
  .brand-mark svg { height: 1.5rem; width: 1.5rem; fill: #fff; }
  .brand-name { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; }
  .card {
    overflow: hidden;
    border-radius: 1rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: #111827;
    padding: 2.5rem 2rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
  }
  .icon {
    margin: 0 auto 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 3.5rem;
    width: 3.5rem;
    border-radius: 9999px;
    background: rgba(251, 191, 36, 0.15);
  }
  .icon svg { height: 1.75rem; width: 1.75rem; stroke: #fbbf24; }
  h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.02em; }
  .lede {
    margin-top: 0.75rem;
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.5);
  }
  .actions {
    margin-top: 1.75rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.625rem;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border-radius: 0.75rem;
    padding: 0.625rem 1.1rem;
    font-size: 0.75rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn-primary { background: #fff; color: #0f172a; }
  .btn-primary:hover { background: #e2e8f0; }
  .btn-ghost { border-color: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.7); background: transparent; }
  .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.3); color: #fff; }
  .foot {
    margin-top: 1.5rem;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: rgba(255, 255, 255, 0.2);
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div class="accent"></div>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<main class="wrap">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </span>
    <span class="brand-name">Centryk</span>
  </div>

  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
    </div>
    <h1>Something went wrong</h1>
    <p class="lede">
      An unexpected error stopped this page from loading. Our team has been
      notified. Please try again in a moment.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="javascript:location.reload()">Try again</a>
      <a class="btn btn-ghost" href="/">Back to Centryk</a>
    </div>
    <p class="foot">&copy; <span id="y">2026</span> Centryk</p>
  </div>
</main>

<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
